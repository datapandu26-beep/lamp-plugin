name: Build AML Plugin
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone AML SDK
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git
          mkdir -p AML/include/mod
          cp -r AndroidModLoader/mod/* AML/include/mod/

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Build arm64-v8a Shared Library
        run: |
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk APP_ABI=arm64-v8a

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightsControl-64bit
          path: libs/arm64-v8a/libLightsControl.so
          
